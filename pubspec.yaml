name: pluto
description: A beautiful new tab for your browser built with love in Flutter.

publish_to: 'none'

version: 0.7.0

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  get_it: ^9.2.1
  json_annotation: ^4.12.0
  collection: ^1.19.1
  intl: ^0.20.3
  http: ^1.6.0
  #  dropdown_button2: ^1.9.2
  file_picker: ^13.1.0
  screwdriver: ^5.12.0
  flutter_multi_formatter: ^2.13.11
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  flutter_screwdriver: ^4.0.0+1
  flutter_markdown_plus: ^1.0.12
  mobx: ^2.7.0
  flutter_mobx: ^2.4.0
  rxdart: ^0.28.0
  universal_io: ^2.3.1
  unsplash_client: ^3.0.0
  shared:
    path: shared
  pexels:
    path: packages/pexels
  ticking_widget: ^1.0.0
  universal_web: ^1.1.1+1
  http_interceptor: ^3.0.0
  super_drag_and_drop: ^0.10.0-dev.2
  super_clipboard: ^0.10.0-dev.2
  super_context_menu: ^0.10.0-dev.2
  cross_file: ^0.3.5+5
  mime: ^2.1.0
  path: ^1.9.1
  palette_generator_master: ^1.1.0
  material_color_utilities: ^0.13.0
  dynamic_color: ^2.1.0

  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  characters: ^1.4.1
  dart_style: ^3.1.13
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  yaml: ^3.1.4
  mobx_codegen: ^2.8.0

dependency_overrides:
  watcher: ^1.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Product
      fonts:
        - asset: assets/fonts/Product.ttf
    - family: Cardo
      fonts:
        - asset: assets/fonts/Cardo-Regular.ttf
    - family: Cardo Italics
      fonts:
        - asset: assets/fonts/Cardo-Italics.ttf
    - family: Jakarta Sans
      fonts:
        - asset: assets/fonts/JakartaSans-Regular.ttf
        - asset: assets/fonts/JakartaSans-Medium.ttf
          weight: 500
    - family: Renner
      fonts:
        - asset: assets/fonts/Renner-Medium.otf

scripts: scripts.yaml